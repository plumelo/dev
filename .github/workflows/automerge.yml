name: Auto Approve and Merge PRs

on:
  pull_request:
  workflow_call:
    inputs:
      allowed-users:
        type: string
        default: '["dependabot[bot]"]'
      merge-method:
        type: string
        default: '--squash'
    secrets:
      token:
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

env:
  PR_URL: ${{ github.event.pull_request.html_url }}

jobs:
  auto-approve-and-merge:
    runs-on: ubuntu-latest
    if: contains(fromJSON(inputs.allowed-users || '["dependabot[bot]"]'), github.event.pull_request.user.login)
    steps:
      - name: Wait for PR checks to complete
        run: |
          sha=$(gh pr view "$PR_URL" --json headRefOid -q .headRefOid)
          while true; do
            checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --paginate -q \
              '[.check_runs[] | {name: .name, status: .status, conclusion: .conclusion, started: .started_at}]')
            filtered=$(echo "$checks" | jq '[.[] | select(.name | contains("auto-approve-and-merge") | not)]')
            if [ "$(echo "$filtered" | jq length)" -eq 0 ]; then
              echo "Waiting for checks to appear..."
              sleep 10
              continue
            fi
            latest=$(echo "$filtered" | jq 'group_by(.name) | map(max_by(.started))')
            running=$(echo "$latest" | jq -r '.[] | select(.status != "completed") | .name + ": " + .status')
            if [ -n "$running" ]; then
              echo "$running"
              sleep 10
            else
              failed=$(echo "$latest" | jq -r '.[] | select(.conclusion == "failure") | .name + ": failure"')
              if [ -n "$failed" ]; then
                echo "$failed"
                exit 1
              fi
              passed=$(echo "$latest" | jq -r '.[] | .name + ": " + .conclusion')
              echo "$passed"
              break
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
      - name: Approve PR
        run: |
          for i in 1 2 3; do
            if gh pr review --approve "$PR_URL"; then
              exit 0
            fi
            echo "Approve attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "All approve attempts failed"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
      - name: Enable auto-merge
        run: |
          for i in 1 2 3; do
            if gh pr merge --auto ${{ inputs.merge-method }} "$PR_URL"; then
              exit 0
            fi
            echo "Auto-merge attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "All auto-merge attempts failed"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}